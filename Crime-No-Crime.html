<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140906">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Crime No Crime</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#160a06; --ink:#f7ecd6; --muted:#cdb898; --line:rgba(217,174,88,.35);
  --brass:#d9ae58; --brass-d:#a07a32; --velvet:#7d1418;
  --glass:rgba(24,11,6,.92); --field:rgba(255,236,200,.07);
  --paper:#f3e5c4; --paper2:#e6cf9f; --paper-ink:#2b1a0e; --paper-muted:#6b5133;
  --red-ans:#c4141c; --t0:#e0474a; --t1:#4fa3d6;
  --good:#2e7d4f; --bad:#a3161c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#100604; --glass:rgba(18,8,4,.94); }
}
:root[data-theme="dark"]{ --bg:#100604; --glass:rgba(18,8,4,.94); }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden;background:#1a0b06}

/* ---------- Courtroom ---------- */
#court3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.film{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 110px 30px rgba(11,8,11,.4);background:linear-gradient(180deg,rgba(12,8,10,.55),transparent 22%,transparent 72%,rgba(12,8,10,.6))}
#app{background:radial-gradient(ellipse at 50% 30%,#4a2614,#140a06 70%)}
.mini-score{display:flex}
@media (max-width:560px){body.has-card .brand{display:none}}

.sb-title{font:700 12px Inter,sans-serif;letter-spacing:.18em;fill:var(--brass)}
.sb-name{font:700 16px Inter,sans-serif}
.sb-name.t0{fill:var(--t0)} .sb-name.t1{fill:var(--t1)}
.sb-score{font:800 52px Cinzel,Georgia,serif;fill:#f6dc94}
.sb-goal{font:600 10px Inter,sans-serif;letter-spacing:.12em;fill:#9c8462}
.sb-act{fill:var(--brass);opacity:0;transition:opacity .3s}
.sb-act.on{opacity:1;animation:actPulse 1.6s ease-in-out infinite}
@keyframes actPulse{50%{opacity:.35}}
.sb-score.bump{animation:bump .6s ease}
@keyframes bump{40%{fill:#fff}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#judge{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(1.5px)}}
#gavel{transform-box:fill-box;transform-origin:8% 70%}
#gavel.bang{animation:bang .55s cubic-bezier(.3,.1,.3,1)}
@keyframes bang{0%{transform:rotate(0)}35%{transform:rotate(-38deg)}60%{transform:rotate(4deg)}75%{transform:rotate(-4deg)}100%{transform:rotate(0)}}
.juror{transform-box:fill-box;transform-origin:50% 100%;animation:bob 4.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1.6px)}}
.lampglow{animation:flicker 6s ease-in-out infinite}
@keyframes flicker{50%{opacity:.82}}

/* ---------- HUD ---------- */
.hud{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:10px 12px;pointer-events:none}
.hud>*{pointer-events:auto}
.hud-left{display:flex;align-items:center;gap:10px;min-width:0}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(20,9,5,.7);cursor:pointer;font-size:20px;display:grid;place-items:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.brand{font-family:Cinzel,Georgia,serif;font-weight:800;font-size:clamp(13px,2.4vw,19px);letter-spacing:.06em;color:var(--brass);text-shadow:0 2px 8px #000;white-space:nowrap}
.game-clock{font:700 13px Inter,sans-serif;color:var(--ink);background:rgba(20,9,5,.7);border:1px solid var(--line);border-radius:999px;padding:4px 10px;display:none}
.game-clock.on{display:inline-block}
.mini-score{display:none;align-self:center;gap:6px;font:800 14px Inter,sans-serif;background:rgba(20,9,5,.78);border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap}
body.has-card .mini-score{display:flex}
.mini-score .t0{color:var(--t0)} .mini-score .t1{color:var(--t1)}
.timer{position:relative;width:70px;height:70px;flex:none}
.timer svg{width:100%;height:100%;display:block}
.ring-bg{fill:rgba(20,9,5,.82);stroke:rgba(217,174,88,.25);stroke-width:6}
.ring{fill:none;stroke:var(--brass);stroke-width:6;stroke-linecap:round;transition:stroke .2s}
.tnum{position:absolute;inset:0;display:grid;place-items:center;font:800 24px Cinzel,Georgia,serif;color:#f6dc94}
.tlabel{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:3px;font:600 11px Inter,sans-serif;color:var(--muted);white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px #000}
.timer.idle{opacity:.55}
.timer.urgent .ring{stroke:#ff4438}
.timer.urgent{animation:urg .5s ease-in-out infinite alternate}
@keyframes urg{to{transform:scale(1.08)}}

/* ---------- Announcement ---------- */
.announce{position:absolute;inset:0;z-index:35;display:none;place-items:center;padding:20px;background:radial-gradient(ellipse at center,rgba(0,0,0,.35),rgba(0,0,0,.75))}
.announce.show{display:grid}
.ann-box{text-align:center;max-width:520px;animation:stampIn .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stampIn{0%{transform:scale(2.2);opacity:0}100%{transform:scale(1);opacity:1}}
.ann-team{font:800 clamp(15px,3vw,18px) Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase}
.ann-team.t0{color:var(--t0)} .ann-team.t1{color:var(--t1)}
.ann-name{font:800 clamp(38px,9vw,70px)/1.02 Cinzel,Georgia,serif;color:#f6dc94;text-shadow:0 4px 24px rgba(0,0,0,.8);margin:8px 0 2px;word-break:break-word}
.ann-line{font:600 clamp(22px,5vw,32px) "Crimson Pro",Georgia,serif;font-style:italic;color:var(--ink)}
.ann-sub{color:var(--muted);margin:14px auto 22px;max-width:36ch;line-height:1.5}

/* ---------- Card ---------- */
.card-stage{position:absolute;left:50%;bottom:12px;width:min(620px,calc(100% - 20px));transform:translateX(-50%);z-index:30;perspective:1400px;pointer-events:none}
.card{pointer-events:auto;display:none;position:relative;
  background:linear-gradient(165deg,var(--paper),var(--paper2));color:var(--paper-ink);
  border-radius:16px;padding:18px 20px 20px;
  box-shadow:0 26px 60px rgba(0,0,0,.6),inset 0 0 0 2px rgba(120,80,30,.28),inset 0 0 50px rgba(140,90,30,.22);
  max-height:64vh;max-height:min(64dvh,calc(100dvh - 110px));overflow-y:auto;overscroll-behavior:contain;transform-origin:50% 100%}
.card.show{display:block;animation:cardPop .6s cubic-bezier(.2,1.25,.4,1) both}
.card.flip{animation:flip .5s ease both}
@keyframes cardPop{0%{transform:translateY(85%) scale(.45) rotateX(40deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.card::before{content:"";position:absolute;inset:7px;border:1px solid rgba(110,70,25,.35);border-radius:11px;pointer-events:none}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.card-no{font:700 13px Cinzel,Georgia,serif;letter-spacing:.08em;color:var(--paper-muted)}
.chip{display:inline-block;font:700 12px Inter,sans-serif;padding:3px 9px;border-radius:999px;color:#fff;white-space:nowrap;max-width:60vw;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.chip.t0{background:#b8282c} .chip.t1{background:#2a77a8}
.scenario{font:500 clamp(20px,3.2vw,25px)/1.38 "Crimson Pro",Georgia,serif;margin:4px 0 14px}
.scenario.sm{font-size:clamp(16px,2.4vw,18px);color:#4a3220;margin:0 0 12px;padding-left:12px;border-left:3px solid rgba(110,70,25,.35)}
.prompt{font:800 clamp(20px,3.6vw,26px) Cinzel,Georgia,serif;text-align:center;margin:6px 0 2px}
.who{text-align:center;color:var(--paper-muted);font-size:14px;margin-bottom:14px}
.choice-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:12px;padding:13px 18px;min-height:50px;cursor:pointer;font:700 16px Inter,sans-serif;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.97)}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-crime{background:linear-gradient(#d4282f,#8e0f15);color:#fff;font:800 clamp(18px,3.4vw,22px) Cinzel,Georgia,serif;letter-spacing:.04em;box-shadow:0 4px 0 #5a070b}
.btn-nc{background:linear-gradient(#33637a,#1b3949);color:#fff;font:800 clamp(18px,3.4vw,22px) Cinzel,Georgia,serif;letter-spacing:.04em;box-shadow:0 4px 0 #0e222c}
.btn-primary{background:linear-gradient(#ecc66d,#b58736);color:#2a1606;box-shadow:0 3px 0 #7a5418}
.btn-ghost{background:transparent;border:1.5px solid currentColor;opacity:.9}
.wide{width:100%;margin-top:14px}
.linkish{background:none;border:0;padding:10px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:14px;color:var(--paper-muted);display:block;margin:10px auto 0}
.result{font:800 clamp(28px,6vw,40px) Cinzel,Georgia,serif;text-align:center;margin:4px 0}
.result.good{color:var(--good)} .result.bad{color:var(--bad)}
.result-sub{text-align:center;font:500 18px/1.4 "Crimson Pro",Georgia,serif;margin:0 0 6px}
.steal-banner{background:#2b1a0e;color:#f6dc94;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px;line-height:1.45}
.steal-banner b{color:#fff}
.huddle-title{font:800 clamp(22px,4vw,28px) Cinzel,Georgia,serif;margin:0 0 4px}
.huddle-sub{color:var(--paper-muted);font-size:14px;margin:0 0 12px;line-height:1.45}
.ans-input{width:100%;font:600 18px Inter,sans-serif;padding:14px;border-radius:12px;border:2px solid rgba(110,70,25,.4);background:#fffaf0;color:var(--paper-ink)}
.ans-input:focus{outline:none;border-color:#9c6a1e}
.row2{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
.judge-says{background:#2b1a0e;color:#f6dc94;border-radius:12px;padding:10px 12px 2px;margin-bottom:12px}
.judge-says .js-who{font:700 13px Inter,sans-serif;color:var(--brass);margin-bottom:4px}
.judge-says .said{color:#fff;font-size:18px;margin-bottom:8px}
.judge-says .verdict.good{background:rgba(70,180,110,.18);color:#9fe0b4}
.judge-says .verdict.bad{background:rgba(230,70,70,.18);color:#ffaaa5}
.said{font:600 20px/1.35 "Crimson Pro",Georgia,serif;text-align:center;margin:2px 0 10px}
.verdict{border-radius:10px;padding:10px 12px;font-weight:700;text-align:center;margin-bottom:12px}
.verdict.good{background:rgba(46,125,79,.15);color:#1f5e3a}
.verdict.meh{background:rgba(160,120,40,.18);color:#6b4a10}
.verdict.bad{background:rgba(163,22,28,.12);color:var(--bad)}
.rule-label{font-size:13px;font-weight:700;color:var(--paper-muted);margin:4px 0 6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:96px;min-height:46px;border-radius:10px;border:2px solid rgba(110,70,25,.35);background:#fffaf0;cursor:pointer;font-weight:700;font-size:14px;padding:8px}
.seg button.on{background:#2b1a0e;color:#f6dc94;border-color:#2b1a0e}
.seg button.red.on{background:var(--red-ans);border-color:var(--red-ans);color:#fff}
details.key{margin-top:12px;background:rgba(43,26,14,.06);border-radius:10px;padding:8px 12px}
details.key summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--paper-muted)}
.charges{list-style:none;padding:0;margin:6px 0 12px}
.charges li{font:600 19px/1.3 "Crimson Pro",Georgia,serif;padding:6px 0;border-bottom:1px dashed rgba(110,70,25,.3)}
.charges li.red{color:var(--red-ans)}
.charges li em{font:800 11px Inter,sans-serif;font-style:normal;letter-spacing:.08em;background:var(--red-ans);color:#fff;padding:2px 6px;border-radius:4px;margin-left:6px;vertical-align:middle}
.charges small{display:block;font:400 13px Inter,sans-serif;color:var(--paper-muted)}
.stamp{display:inline-block;font:800 clamp(30px,7vw,44px) Cinzel,Georgia,serif;padding:2px 16px;border:4px solid;border-radius:8px;transform:rotate(-4deg);margin:2px 0 12px;animation:stampIn .45s cubic-bezier(.2,1.4,.4,1) both}
.stamp.is-crime{color:var(--red-ans)} .stamp.is-nc{color:#1f5e3a}
.exp{font:400 17px/1.5 "Crimson Pro",Georgia,serif;background:rgba(255,250,240,.6);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.log{list-style:none;padding:0;margin:0;font-size:14px}
.log li{padding:4px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.log li.note{color:var(--paper-muted);font-style:italic}
.foul{display:block;margin:12px auto 0;background:none;border:0;color:#8a2a1a;font-weight:700;font-size:13px;cursor:pointer;padding:8px;text-decoration:underline;text-underline-offset:3px}

/* ---------- Full-screen panels ---------- */
.screen{position:absolute;inset:0;z-index:50;display:none;overflow-y:auto;padding:16px;background:rgba(8,3,2,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.screen.show{display:block}
.panel{max-width:760px;margin:clamp(8px,4vh,48px) auto;background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,4vw,32px);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.panel h2{font:800 clamp(24px,4vw,32px) Cinzel,Georgia,serif;color:#f6dc94;margin:0 0 8px}
.panel h3{font:700 17px Inter,sans-serif;color:var(--brass);margin:20px 0 6px}
.panel p,.panel li{line-height:1.55;color:var(--ink)}
.panel ul{padding-left:20px;margin:6px 0}
.hint{color:var(--muted);font-size:14px}
.logo{text-align:center;margin-bottom:18px}
.logo-mark{font-size:40px;line-height:1}
.logo h1{font:800 clamp(34px,8vw,58px)/1 Cinzel,Georgia,serif;margin:8px 0 6px;color:#f6dc94;letter-spacing:.03em;text-shadow:0 3px 0 #5a2a10,0 8px 30px rgba(0,0,0,.6)}
.logo p{margin:0;color:var(--muted);font:italic 400 19px "Crimson Pro",Georgia,serif}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.teams{grid-template-columns:1fr}}
.team-card{border-radius:14px;padding:14px;background:rgba(255,236,200,.04);border:1px solid var(--line);border-top:4px solid}
.team-card.t0{border-top-color:var(--t0)} .team-card.t1{border-top-color:var(--t1)}
.team-card label{display:block;font-size:13px;font-weight:700;color:var(--muted)}
.field{width:100%;margin-top:6px;font:600 16px Inter,sans-serif;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--ink)}
.field::placeholder{color:rgba(205,184,152,.55)}
.team-card .tname{font-size:18px;font-weight:800}
.plabel{font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 0}
.opt{margin:18px 0 6px}
.opt-label{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.dseg{display:flex;gap:6px;flex-wrap:wrap}
.dseg button{flex:1 1 0;min-width:100px;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--field);cursor:pointer;font-weight:700}
.dseg button.on{background:var(--brass);color:#2a1606;border-color:var(--brass)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.actions .btn{flex:1 1 160px}
.stack{display:grid;gap:10px;margin-top:14px}
.dice{display:flex;justify-content:center;gap:clamp(20px,8vw,64px);margin:22px 0 10px}
.die-wrap{text-align:center}
.die{width:86px;height:86px;border-radius:16px;background:linear-gradient(145deg,#fbf3df,#d9c49a);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:12px;gap:2px;box-shadow:0 8px 0 #8a6a35,0 14px 30px rgba(0,0,0,.5);margin:0 auto}
.die.rolling{animation:shake .16s linear infinite}
@keyframes shake{25%{transform:rotate(8deg)}75%{transform:rotate(-8deg)}}
.pip{width:15px;height:15px;border-radius:50%;place-self:center;background:transparent}
.pip.on{background:#2b1a0e}
.die-team{margin-top:14px;font-weight:800;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.die-team.t0{color:var(--t0)} .die-team.t1{color:var(--t1)}
.roll-msg{text-align:center;font:600 20px "Crimson Pro",Georgia,serif;min-height:30px}
textarea.field{min-height:160px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace}
pre.code{white-space:pre-wrap;word-break:break-word;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;background:rgba(0,0,0,.35);padding:10px;border-radius:10px;color:#f1dcae;overflow-x:auto}
.win{text-align:center}
.win .trophy{font-size:64px}
.win .final{display:flex;justify-content:center;gap:28px;margin:14px 0 6px;flex-wrap:wrap}
.win .final div{font-weight:800}
.win .final b{display:block;font:800 46px Cinzel,Georgia,serif;color:#f6dc94}
.float{position:absolute;z-index:60;font:800 30px Cinzel,Georgia,serif;color:#ffe08a;text-shadow:0 2px 10px #000;pointer-events:none;transform:translate(-50%,0);animation:floatUp 1.4s ease-out forwards}
.float.neg{color:#ff6b6b}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
.toast{position:absolute;left:50%;top:86px;transform:translateX(-50%);z-index:70;background:#2b1a0e;border:1px solid var(--brass);color:#f6dc94;padding:10px 16px;border-radius:12px;font-weight:700;max-width:90%;text-align:center;animation:toast 2.8s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-10px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.confetti{position:absolute;top:-20px;width:10px;height:16px;z-index:55;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

@media (max-height:500px) and (orientation:landscape){
  .card{max-height:calc(100dvh - 24px);padding:12px 16px}
  .card-stage{bottom:8px;width:min(620px,calc(100% - 180px))}
  .scenario{font-size:19px;margin-bottom:8px}
  .btn{min-height:44px;padding:10px 14px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app">
<canvas id="court3d" aria-label="3D courtroom. Drag to look around."></canvas><div class="film" aria-hidden="true"></div>

<header class="hud">
  <div class="hud-left">
    <button class="icon-btn" id="menuBtn" aria-label="Menu" onclick="openMenu()">☰</button>
    <div>
      <div class="brand">Crime No Crime</div>
      <div id="gameClock" class="game-clock"></div>
    </div>
  </div>
  <div id="miniScore" class="mini-score"></div>
  <div id="timer" class="timer idle" role="timer" aria-live="off">
    <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" class="ring-bg"/><circle id="ring" cx="32" cy="32" r="28" class="ring" stroke-dasharray="175.93" stroke-dashoffset="0" transform="rotate(-90 32 32)"/></svg>
    <div class="tnum" id="timerNum">⌛</div>
    <div class="tlabel" id="timerLabel"></div>
  </div>
</header>

<div id="announce" class="announce"></div>
<div class="card-stage"><div id="card" class="card" role="dialog" aria-live="polite"></div></div>
<div id="screen" class="screen"></div>
</div>


<script>(()=>{/**
 * @license

function resumeTimer(){if(T.onEnd&&T.paused){T.paused=false;T.end=performance.now()+T.rem;tick()}}

setInterval(()=>{if(!G.running||G.paused||G.mode==='100')return;
  if(G.timeLeft>0){G.timeLeft=Math.max(0,G.timeLeft-1000);if(G.timeLeft===0)toast("Time's up! Finish this card for the final verdict.")}
  renderClock()},1000);
function renderClock(){const c=$('#gameClock');if(!G.running||G.mode==='100'){c.classList.remove('on');return}
  const s=Math.ceil(G.timeLeft/1000);c.textContent='⏱ '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');c.classList.add('on')}

/* ---------- Screens ---------- */
function screen(html){const s=$('#screen');s.innerHTML=html;s.classList.add('show');s.scrollTop=0}
function closeScreen(){$('#screen').classList.remove('show')}

function showSetup(){
  G.running=false;G.R=null;G.menu=false;G.paused=false;stopTimer();hideCard();$('#announce').classList.remove('show');renderClock();updateScore();
  screen(`<div class="panel">
    <div class="logo"><div class="logo-mark">⚖️</div><h1>Crime No Crime</h1><p>Know the law. Know the consequences.</p></div>
    <div class="teams">${[0,1].map(t=>`<div class="team-card t${t}">
      <label for="tn${t}">Team name</label><input class="field tname" id="tn${t}" maxlength="18" value="${esc(G.teams[t].name)}">
      <div class="plabel">Players, in answering order</div>
      ${[0,1,2,3].map(i=>`<input class="field" id="tp${t}${i}" maxlength="16" aria-label="Team ${t+1} player ${i+1}" placeholder="Player ${i+1}${i?' (optional)':''}" value="${esc(G.teams[t].players[i]||'')}">`).join('')}
    </div>`).join('')}</div>
    <div class="opt"><div class="opt-label">Game length</div><div class="dseg" id="modeSeg">
      ${[['100','First to 100 points'],['15','15 minutes'],['30','30 minutes']].map(([v,l])=>`<button class="${G.mode===v?'on':''}" data-v="${v}" onclick="setMode('${v}')">${l}</button>`).join('')}
    </div></div>
    <p class="hint">The Judge runs the game: she reads each scenario, keeps the clock and the score, and rules on every answer. Just pass the device to whoever is up.</p>
    <div class="actions">
      <button class="btn btn-ghost" onclick="showHelp('setup')">How to play</button>
      <button class="btn btn-ghost" id="sndBtn" onclick="toggleSound()">${G.sound?'🔊 Sound on':'🔇 Sound off'}</button>
      <button class="btn btn-ghost" id="spkBtn" onclick="toggleSpeak()">${G.speak?'🗣 Judge reads aloud':'🤫 Judge reads silently'}</button>
      <button class="btn btn-primary" onclick="toRoll()">🎲 Roll for first turn</button>
    </div></div>`);
}
function setMode(v){G.mode=v;document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===v))}
function readSetup(){if(!$('#tn0'))return;setTimeout(syncRoster,0);[0,1].forEach(t=>{G.teams[t].name=$('#tn'+t).value.trim()||('Team '+(t+1));G.teams[t].players=[0,1,2,3].map(i=>$('#tp'+t+i).value.trim())});saveSetup();updateScore()}
function toggleSound(){G.sound=!G.sound;saveSetup();const b=$('#sndBtn');if(b)b.textContent=G.sound?'🔊 Sound on':'🔇 Sound off';if(G.sound)sfx('ding')}

function pips(n){const on={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]}[n];return Array.from({length:9},(_,i)=>`<span class="pip${on.includes(i)?' on':''}"></span>`).join('')}
function toRoll(){readSetup();ac();G.running=false;G.R=null;hideCard();stopTimer();
  screen(`<div class="panel" style="text-align:center"><h2>Roll the die</h2><p class="hint">The higher roll becomes Team 1 and takes the first scenario.</p>
  <div class="dice">${[0,1].map(t=>`<div class="die-wrap"><div class="die" id="die${t}">${pips(t?6:1)}</div><div class="die-team t${t}">${esc(teamName(t))}</div></div>`).join('')}</div>
  <div id="rollMsg" class="roll-msg">&nbsp;</div><div class="actions" id="rollAct"><button class="btn btn-primary" onclick="doRoll()">🎲 Roll</button></div></div>`)}
function doRoll(){$('#rollAct').innerHTML='';$('#rollMsg').innerHTML='&nbsp;';const d=[$('#die0'),$('#die1')];d.forEach(x=>x.classList.add('rolling'));
  let n=0,a=1,b=1;const iv=setInterval(()=>{a=1+Math.floor(Math.random()*6);b=1+Math.floor(Math.random()*6);d[0].innerHTML=pips(a);d[1].innerHTML=pips(b);sfx('tick');
    if(++n>13){clearInterval(iv);d.forEach(x=>x.classList.remove('rolling'));
      if(a===b){$('#rollMsg').textContent=`Both rolled ${a}. Roll again.`;$('#rollAct').innerHTML='<button class="btn btn-primary" onclick="doRoll()">🎲 Roll again</button>'}
      else{const f=a>b?0:1;sfx('ding');$('#rollMsg').innerHTML=`<b>${esc(teamName(f))}</b> rolled higher and goes first as Team 1.`;
        $('#rollAct').innerHTML=`<button class="btn btn-primary" onclick="startGame(${f})">⚖️ Call court to order</button>`}}},85)}

function shuffleDeck(){G.deck=CARDS.map((_,i)=>i);for(let i=G.deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[G.deck[i],G.deck[j]]=[G.deck[j],G.deck[i]]}}
function drawCard(){if(!G.deck.length){shuffleDeck();toast('Deck reshuffled')}return CARDS[G.deck.pop()]}
function startGame(first){G.cur=first;G.teams.forEach(t=>{t.score=0;t.idx=0});G.drawn=0;shuffleDeck();
  G.timeLeft=G.mode==='100'?0:parseInt(G.mode,10)*60000;G.running=true;G.paused=false;closeScreen();syncRoster();updateScore();renderClock();newRound(false)}

/* ---------- Round flow ---------- */
function newRound(same){const t=G.cur;
  G.R={card:drawCard(),num:++G.drawn,team:t,player:currentPlayer(t),phase:'announce',fouled:false,cncCorrect:false,log:[],prov:null,nameTeam:t,nameMode:'primary',pending:null,sel:null};
  hideCard();window.Court3D&&(Court3D.lower(),Court3D.lookHome());showAnnounce(same)}
function showAnnounce(same){const R=G.R,t=R.team;
  $('#announce').innerHTML=`<div class="ann-box"><div class="ann-team t${t}">${esc(teamName(t))}</div>
    <div class="ann-name">${esc(R.player)},</div><div class="ann-line">${same?"you're still on the stand.":"you're up!"}</div>
    <p class="ann-sub">${same?'That was correctly No Crime, so you get another scenario.':'Answer Crime or No Crime on your own. Teammates stay quiet. You have 20 seconds once the card appears.'}</p>
    <button class="btn btn-primary" onclick="phaseCNC(true)">Show my card</button></div>`;
  $('#announce').classList.add('show');updateActive();bang();sayLine(same?`${R.player}, you're still on the stand.`:`${R.player}, you're up!`)}

function head(label,team){const R=G.R;return `<div class="card-head"><span class="card-no">${label} No. ${R.num}</span>${team!=null?`<span class="chip t${team}">${esc(teamName(team))}</span>`:''}</div>`}

function phaseCNC(pop){const R=G.R;R.phase='cnc';$('#announce').classList.remove('show');
  const html=`${head('Scenario',R.team)}<p class="scenario">${esc(R.card.s)}</p>
    <div class="prompt">Crime or No Crime?</div><div class="who"><b>${esc(R.player)}</b> answers alone</div>
    <div class="choice-row"><button class="btn btn-crime" onclick="answerCNC(true)">CRIME</button><button class="btn btn-nc" onclick="answerCNC(false)">NO CRIME</button></div>
    ${R.fouled?'':'<button class="foul" onclick="foul()">🚩 Report: a teammate helped</button>'}`;
  pop?popCard(html):renderCard(html,true);updateActive();
  if(pop&&window.Court3D)Court3D.present('Scenario No. '+R.num,R.card.s);
  const go=()=>{if(G.R===R&&R.phase==='cnc')startTimer(20,R.player,()=>answerCNC(null))};
  pop?judgeReads(R.card.s,go):go()}

function foul(){const R=G.R;if(R.phase!=='cnc'||R.fouled)return;stopTimer();sfx('wrong');
  R.fouled=true;R.log.push({note:`Foul: a teammate helped. ${teamName(R.team)} forfeits the turn.`});
  R.team=1-R.team;R.player=currentPlayer(R.team);toast(`Foul! ${teamName(R.team)} takes the question.`);phaseCNC(false)}

function answerCNC(choice){const R=G.R;if(R.phase!=='cnc')return;stopTimer();stopSpeech();
  const correct=choice!==null&&choice===R.card.crime;R.cncCorrect=correct;R.phase='cncResult';
  if(correct){sfx('ding');award(R.team,5,'Correct Crime / No Crime call')}else if(choice!==null)sfx('wrong');
  const o=1-R.team,c=R.card.crime;let title,sub,btn;
  if(correct&&c){title='Correct!';sub=`It is a crime. Now ${esc(teamName(R.team))} huddles up to name it.`;btn=`<button class="btn btn-primary wide" onclick="phaseName(${R.team},'primary')">Start the 20-second huddle</button>`}
  else if(correct){title='Correct!';sub='No crime was committed.';btn=`<button class="btn btn-primary wide" onclick="reveal()">See why</button>`}
  else if(c){title=choice===null?"Time's up":'Not quite';sub=`It is a crime. ${esc(teamName(o))} can steal by naming it.`;btn=`<button class="btn btn-primary wide" onclick="phaseName(${o},'any')">Start ${esc(teamName(o))}'s steal</button>`}
  else{title=choice===null?"Time's up":'Not quite';sub='No crime was committed, so no points this time.';btn=`<button class="btn btn-primary wide" onclick="reveal()">See why</button>`}
  renderCard(`${head('Scenario',R.team)}<p class="scenario sm">${esc(R.card.s)}</p>
    <div class="result ${correct?'good':'bad'}">${title}${correct?' +5':''}</div><p class="result-sub">${sub}</p>${btn}`,false)}

function phaseName(team,mode){const R=G.R;R.phase='name';R.nameTeam=team;R.nameMode=mode;updateActive();
  const pts='A listed crime earns 10 points; the bonus answer earns 15.';
  let top='',title,sub;
  if(mode==='primary'){title="What's the crime?";sub=`${esc(teamName(team))}, talk it over and name the most severe crime. ${pts}`}
  else if(mode==='any'){title='Steal!';top=`<div class="steal-banner"><b>${esc(teamName(team))}</b> can steal. Name any crime listed on this card. ${pts}</div>`;sub='Agree on one answer within 20 seconds.'}
  else{title='Bonus steal!';top=`<div class="steal-banner">${esc(teamName(1-team))} named a listed crime, but this card has a bonus answer. <b>${esc(teamName(team))}</b>: name the bonus answer to steal 15 points plus 5 extra. ${esc(teamName(1-team))} would lose its 10.</div>`;sub='Only the bonus answer counts.'}
  renderCard(`${head('Scenario',team)}${top}<p class="scenario sm">${esc(R.card.s)}</p>
    <h3 class="huddle-title">${title}</h3><p class="huddle-sub">${sub}</p>
    <input id="ansIn" class="ans-input" placeholder="Type the crime…" autocomplete="off" autocapitalize="words" enterkeyhint="done" onkeydown="if(event.key==='Enter')submitName(false)">
    <div class="row2"><button class="btn btn-primary" onclick="submitName(false)">Lock in answer</button></div>`,false);
  if(matchMedia('(pointer:fine)').matches)setTimeout(()=>{const i=$('#ansIn');i&&i.focus()},60);
  startTimer(20,teamName(team),()=>submitName(true))}

/* ---------- The Judge: automatic rulings ----------
   Listed (black) crimes: lenient. Close wording or a shared key word counts.
   Bonus (red) answers: strict. Every key word of the bonus crime must be there. */
const STOP=new Set('a an the of to in on for by at with from and or degree first second third 1st 2nd 3rd charge charged crime is it its while under into upon'.split(' '));
const SYN={battery:'assault',delivery:'distribution',deliver:'distribution',delivering:'distribution',distribute:'distribution',distributing:'distribution',sale:'distribution',selling:'distribution',sell:'distribution',dealing:'distribution',
  dui:'dwi',owi:'dwi',dwai:'dwi',drunk:'intoxicated',cop:'police',cops:'police',officer:'police',officers:'police',policeman:'police',kid:'child',kids:'child',
  airport:'facility',federal:'',deadly:'',firearm:'weapon',gun:'weapon',handgun:'weapon',pistol:'weapon',stealing:'theft',steal:'theft',stole:'theft',larceny:'theft',shoplifting:'theft',porn:'pornography'};
/* words too generic to earn credit on their own */
const WEAK=new Set(['publi','unlaw','illeg','unaut','false','use','using','makin','givin','provi','issua','infor','condu','dutie','perso','aggra','crimi']);
function tok(s){return new Set(String(s).toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean).map(w=>SYN[w]!==undefined?SYN[w]:w).filter(w=>w&&!STOP.has(w)).map(w=>w.slice(0,5)))}
/* tolerate one typo in longer words */
function near(a,b){if(a===b)return true;if(a.length<4||b.length<4||Math.abs(a.length-b.length)>1)return false;
  let i=0,j=0,e=0;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue}if(++e>1)return false;if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++}}
  return e+(a.length-i)+(b.length-j)<=1}
function has(set,w){if(set.has(w))return true;for(const x of set)if(near(x,w))return true;return false}
function judgeAnswer(text,card,mode){
  const inp=tok(text||'');if(!inp.size)return{level:'none'};
  for(const a of card.red)for(const alt of a.split('|')){const k=tok(alt);if(k.size&&[...k].every(w=>has(inp,w)))return{level:'red',ans:primary(a)}}
  if(mode==='red')return{level:'none'};
  for(const a of [...card.black,...card.red])for(const alt of a.split('|')){let strong=false;tok(alt).forEach(w=>{if(!WEAK.has(w)&&has(inp,w))strong=true});if(strong)return{level:'black',ans:primary(a)}}
  return{level:'none'};
}

function submitName(fromTimeout){const R=G.R;if(R.phase!=='name')return;stopTimer();stopSpeech();
  const i=$('#ansIn');const text=i?i.value.trim():'';
  const v=judgeAnswer(text,R.card,R.nameMode);
  R.ruling={team:R.nameTeam,text,level:v.level,mode:R.nameMode};
  applyRuling(v.level)}
function rulingHTML(){const r=G.R&&G.R.ruling;if(!r)return'';
  const said=r.text?`“${esc(r.text)}”`:'<i>No answer before time ran out</i>';
  let cls,msg;
  if(r.level==='red'){cls='good';msg='★ Bonus answer. Exactly right!'}
  else if(r.level==='black'){cls='good';msg='✓ Close enough. That counts as a listed crime.'}
  else if(r.mode==='red'&&r.text){cls='bad';msg="✗ That isn't the bonus answer."}
  else{cls='bad';msg=r.text?"✗ That crime isn't on the card.":'✗ No answer.'}
  return `<div class="judge-says"><div class="js-who">⚖️ The Judge rules on ${esc(teamName(r.team))}'s answer</div><div class="said">${said}</div><div class="verdict ${cls}">${msg}</div></div>`}
function applyRuling(lvl){const R=G.R,t=R.nameTeam,o=1-t,mode=R.nameMode,hasRed=R.card.red.length>0;
  if(mode==='primary'){
    if(lvl==='red'){award(t,15,'Bonus answer');reveal()}
    else if(lvl==='black'){if(hasRed){award(t,10,'Listed crime');R.prov={team:t};stealIntro(o,'red')}else{award(t,10,'Listed crime');reveal()}}
    else{sfx('wrong');stealIntro(o,'any')}
  }else if(mode==='any'){
    if(lvl==='red')award(t,15,'Bonus answer on a steal');else if(lvl==='black')award(t,10,'Listed crime on a steal');
    else{sfx('wrong');R.log.push({note:'Neither team named a crime on the card.'})}
    reveal()
  }else{
    if(lvl==='red'){award(R.prov.team,-10,'Points stolen');award(t,20,'Bonus steal (15 + 5 extra)')}
    else{sfx('wrong');R.log.push({note:`${teamName(R.prov.team)} keeps its 10 points.`})}
    reveal()
  }}
function stealIntro(team,mode){const R=G.R;R.phase='stealIntro';updateActive();
  const msg=mode==='red'?`This card has a bonus answer. ${esc(teamName(team))} gets one try to name it and steal.`
    :`${esc(teamName(team))} can steal by naming a crime on the card.`;
  renderCard(`${head('Scenario',team)}${rulingHTML()}<div class="result bad" style="color:#8a5a10">Steal chance</div><p class="result-sub">${msg}</p>
    <button class="btn btn-primary wide" onclick="phaseName(${team},'${mode}')">Start ${esc(teamName(team))}'s 20 seconds</button>`,false)}

function checkOver(){return G.mode==='100'?G.teams.some(t=>t.score>=100):G.timeLeft<=0}
function reveal(){const R=G.R,c=R.card;stopTimer();R.phase='reveal';updateActive();
  R.same=!c.crime&&R.cncCorrect&&!R.fouled;
  const list=c.crime?`<div class="rule-label">Most severe charges on the card</div><ul class="charges">${c.red.map(a=>`<li class="red">★ ${esc(primary(a))}<em>BONUS</em></li>`).join('')}${c.black.map(a=>`<li>${esc(primary(a))}</li>`).join('')}</ul>`:'';
  const log=R.log.map(l=>l.note?`<li class="note">${esc(l.note)}</li>`:`<li><span class="chip t${l.team}">${esc(teamName(l.team))}</span> <b>${l.pts>0?'+':''}${l.pts}</b> ${esc(l.why)}</li>`).join('')||'<li class="note">No points on this card.</li>';
  let btn;
  if(checkOver())btn='<button class="btn btn-primary wide" onclick="finish()">🏆 Hear the final verdict</button>';
  else if(R.same)btn=`<button class="btn btn-primary wide" onclick="nextTurn()">${esc(R.player)} gets another scenario</button>`;
  else btn=`<button class="btn btn-primary wide" onclick="nextTurn()">Next up: ${esc(currentPlayer(1-G.cur))} (${esc(teamName(1-G.cur))})</button>`;
  renderCard(`${head('Verdict')}${rulingHTML()}<div class="stamp ${c.crime?'is-crime':'is-nc'}">${c.crime?'Crime':'No Crime'}</div>
    <p class="scenario sm">${esc(c.s)}</p>${list}${c.exp?`<div class="exp"><b>Why:</b> ${esc(c.exp)}</div>`:''}<ul class="log">${log}</ul>${btn}`,true)}
function nextTurn(){const R=G.R;if(!R.same){G.teams[G.cur].idx++;G.cur=1-G.cur}newRound(R.same)}

function finish(){stopTimer();hideCard();window.Court3D&&Court3D.lower();G.running=false;updateActive();renderClock();
  const [a,b]=G.teams;const w=a.score===b.score?-1:(a.score>b.score?0:1);
  screen(`<div class="panel win"><div class="trophy">${w<0?'🤝':'🏆'}</div>
    <h2>${w<0?'A hung jury: it\'s a tie!':`The court rules for ${esc(teamName(w))}`}</h2>
    <div class="final">${[0,1].map(t=>`<div class="die-team t${t}">${esc(teamName(t))}<b>${G.teams[t].score}</b></div>`).join('')}</div>
    <p class="hint">${G.drawn} scenario${G.drawn===1?'':'s'} played</p>
    <div class="actions"><button class="btn btn-ghost" onclick="showSetup()">Change teams</button><button class="btn btn-primary" onclick="toRoll()">Rematch</button></div></div>`);
  bang();sfx('win');confetti()}
function confetti(){const cols=['#d9ae58','#e0474a','#4fa3d6','#f6dc94','#fff'];for(let i=0;i<90;i++){const d=document.createElement('div');d.className='confetti';
  d.style.left=Math.random()*100+'%';d.style.background=cols[i%cols.length];d.style.animationDuration=(2.2+Math.random()*2.2)+'s';d.style.animationDelay=(Math.random()*.8)+'s';
  $('#app').appendChild(d);setTimeout(()=>d.remove(),5500)}}

/* ---------- Card element ---------- */
function popCard(html){const c=$('#card');c.innerHTML=html;c.classList.remove('show','flip');void c.offsetWidth;c.classList.add('show');c.scrollTop=0;document.body.classList.add('has-card');sfx('whoosh')}
function renderCard(html,flip){const c=$('#card');if(!c.classList.contains('show'))return popCard(html);
  if(flip){c.classList.remove('flip');void c.offsetWidth;c.classList.add('flip');setTimeout(()=>{c.innerHTML=html;c.scrollTop=0},240)}else{c.innerHTML=html;c.scrollTop=0}}
function hideCard(){$('#card').classList.remove('show','flip');document.body.classList.remove('has-card')}

/* ---------- Menu, help, deck ---------- */
function openMenu(){if(!G.running){if(!$('#screen').classList.contains('show'))showSetup();return}
  G.menu=true;G.paused=true;pauseTimer();stopSpeech();
  screen(`<div class="panel" style="max-width:420px"><h2>Court in recess</h2><p class="hint">The clock is paused.</p><div class="stack">
    <button class="btn btn-primary" onclick="closeMenu()">▶ Resume</button>
    <button class="btn btn-ghost" onclick="showHelp('menu')">How to play</button>
    <button class="btn btn-ghost" id="sndBtn" onclick="toggleSound()">${G.sound?'🔊 Sound on':'🔇 Sound off'}</button>
      <button class="btn btn-ghost" id="spkBtn" onclick="toggleSpeak()">${G.speak?'🗣 Judge reads aloud':'🤫 Judge reads silently'}</button>
    <button class="btn btn-ghost" onclick="G.paused=false;G.menu=false;toRoll()">↻ Restart with same teams</button>
    <button class="btn btn-ghost" onclick="finish()">Declare the final verdict now</button>
    <button class="btn btn-ghost" onclick="showSetup()">✕ Quit to setup</button></div></div>`)}
function closeMenu(){G.menu=false;G.paused=false;closeScreen();resumeTimer();if(G.R&&G.R.deferred){const f=G.R.deferred;G.R.deferred=null;f()}}
/* ---------- The Judge's voice ---------- */
function pickVoice(){try{const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));return vs.find(v=>/female|samantha|victoria|zira|aria|jenny|karen|moira|tessa|serena|ava|allison|google us english/i.test(v.name))||vs[0]}catch(e){return null}}
function canSpeak(){return G.speak&&'speechSynthesis' in window}
function stopSpeech(){try{if('speechSynthesis' in window)speechSynthesis.cancel()}catch(e){}}
function sayLine(t){if(!canSpeak())return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=1;const v=pickVoice();if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function judgeReads(text,done){if(!canSpeak()){done();return}
  let fired=false,to=null;
  const fin=()=>{if(fired)return;fired=true;clearTimeout(to);if(G.paused){if(G.R)G.R.deferred=done}else done()};
  $('#timerLabel').textContent='Judge is reading';$('#timerNum').textContent='🗣';
  to=setTimeout(fin,text.split(/\s+/).length*480+2500);
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.97;const v=pickVoice();if(v)u.voice=v;u.onend=fin;u.onerror=fin;setTimeout(()=>speechSynthesis.speak(u),60)}catch(e){fin()}}
function toggleSpeak(){G.speak=!G.speak;saveSetup();if(!G.speak)stopSpeech();const b=$('#spkBtn');if(b)b.textContent=G.speak?'🗣 Judge reads aloud':'🤫 Judge reads silently'}
function showHelp(back){if(back==='setup')readSetup();
  const backBtn=back==='menu'?'<button class="btn btn-primary" onclick="openMenu()">Back</button>':'<button class="btn btn-primary" onclick="showSetup()">Back</button>';
  screen(`<div class="panel"><h2>How to play</h2>
  <p>Two teams of up to four players decide whether each real-life scenario is a crime, then name the most severe crime for extra points. The first team to 100 wins, or the team ahead when time runs out.</p>
  <h3>Your turn</h3><ul>
   <li>A phrase tells you when it's your turn. Tap <b>Show my card</b> and the Judge reads the scenario aloud. Your 20 seconds start when she finishes.</li>
   <li>You alone have 20 seconds to tap <b>Crime</b> or <b>No Crime</b>. A correct call earns 5 points.</li>
   <li>If it's a crime, your whole team gets 20 seconds to name the most severe crime: 10 points for a listed crime, 15 for the bonus answer (shown in red).</li>
   <li>If it's correctly No Crime, you keep your 5 points and get another scenario until you get a Crime card or miss a No Crime card.</li></ul>
  <h3>Steals</h3><ul>
   <li>Wrong Crime / No Crime call on a crime card: nobody gets the 5, and the other team can name the crime.</li>
   <li>Your team can't name a crime on the card: the other team can name one for the points.</li>
   <li>Your team names a listed crime on a card with a bonus answer: the other team can name the bonus to take 15 points plus 5 extra, and your team loses its 10.</li>
   <li>A teammate helps on the Crime / No Crime call: tap 🚩 to report it, and the other team takes the question.</li>
   <li>Steals never change the turn order. Teams alternate, and players go in their listed order.</li></ul>
  <h3>Accepted answers</h3><ul>
   <li>Type your crime and the Judge rules on it automatically.</li>
   <li><b>Listed crimes (10 points):</b> close is good enough. An answer that shares a key word with a crime on the card counts, and small typos are fine.</li>
   <li><b>Bonus answer (15 points):</b> must be the full crime. "Statutory rape" earns the bonus; "rape" alone earns 10 as a listed crime.</li>
   <li>Assault and battery count as the same crime. Degrees (first, second) aren't needed. Answers reflect the law in most U.S. states and may differ from yours.</li></ul>
  <div class="actions">${backBtn}</div></div>`)}

/* keyboard shortcuts on computers */
addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;const R=G.R;if(!R||$('#screen').classList.contains('show'))return;
  if(R.phase==='cnc'){if(e.key==='c'||e.key==='C')answerCNC(true);if(e.key==='n'||e.key==='N')answerCNC(false)}
  if(e.key==='Escape')openMenu()});

if(window.Court3D)Court3D.onPlate=c=>{if(G.R&&G.R.phase==='cnc'&&!$('#screen').classList.contains('show'))answerCNC(c)};
syncRoster();updateScore();showSetup();
</script>
